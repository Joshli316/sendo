<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Sendō 宣道</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0A0908; color: #F4EAD5; font-family: 'Inter', system-ui, sans-serif; text-align: center; padding: 24px; }
    .container { max-width: 480px; }
    h1 { font-family: 'Noto Serif JP', Georgia, serif; font-size: 2rem; color: #C8323C; margin-bottom: 12px; }
    p { color: #C5B89F; line-height: 1.6; margin-bottom: 24px; }
    a { display: inline-block; padding: 12px 24px; border: 1px solid #C8323C; color: #C8323C; text-decoration: none; border-radius: 4px; font-weight: 500; transition: background 200ms ease; }
    a:hover { background: rgba(200, 50, 60, 0.15); }
    .code { font-family: 'JetBrains Mono', monospace; font-size: 4rem; color: #C8323C; opacity: 0.3; margin-bottom: 16px; }
    .motif { display: inline-block; width: 2px; height: 48px; background: #C8323C; margin-bottom: 24px; position: relative; }
    .motif::before { content: ''; position: absolute; top: 0; left: -19px; width: 40px; height: 2px; background: #C8323C; }
  </style>
</head>
<body>
  <div class="container">
    <div class="motif" aria-hidden="true"></div>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist. It may have been moved or you may have mistyped the URL.</p>
    <a href="/">← Back to Sendō 宣道</a>
  </div>
</body>
</html>
